<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muninn - Memory Card Game</title>
  </head>
  <body>
    <svg style="position: absolute; width: 0; height: 0" aria-hidden="true">
      <!-- Card art: a warm grade, then the night-light tint from index.css -->
      <filter id="warm">
        <feColorMatrix
          color-interpolation-filters="linearRGB"
          type="matrix"
          values="1 0 0 0 0  0 0.855 0 0 0  0 0 0.733 0 0  0 0 0 1 0"
          result="graded"
        />
        <feFlood
          color-interpolation-filters="sRGB"
          style="flood-color: var(--nightlight)"
          result="tint"
        />
        <feComposite
          color-interpolation-filters="sRGB"
          in="graded"
          in2="tint"
          operator="arithmetic"
          k1="1"
        />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
